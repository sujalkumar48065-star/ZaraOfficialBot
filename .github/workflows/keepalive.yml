name: Keep Zara awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and ping health endpoint
        run: |
          curl -fsS \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            https://zara-official-bot.onrender.com/health
