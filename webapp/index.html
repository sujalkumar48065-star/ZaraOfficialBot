<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7fb" />
    <title>Zara Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: #3f3352;
        background:
          radial-gradient(circle at 15% 8%, #ffe7f4 0, transparent 34%),
          radial-gradient(circle at 90% 4%, #e8f4ff 0, transparent 38%),
          linear-gradient(160deg, #fff9fc, #f7f2ff 55%, #eef9ff);
      }
      main { width: min(92vw, 430px); margin: 0 auto; padding: 28px 0 32px; }
      .card {
        padding: 24px 22px;
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 28px;
        background: rgba(255, 255, 255, .78);
        box-shadow: 0 18px 50px rgba(122, 92, 150, .14);
        backdrop-filter: blur(14px);
      }
      .top { display: flex; align-items: center; gap: 10px; }
      .logo {
        display: grid; place-items: center; width: 42px; height: 42px;
        border-radius: 14px; color: #7b4b9a; font-size: 20px; font-weight: 800;
        background: linear-gradient(145deg, #f3c8ff, #c8e4ff);
      }
      .brand { font-weight: 800; letter-spacing: .02em; }
      .sub { margin-top: 2px; color: #8b7c9c; font-size: 12px; }
      h1 { margin: 22px 0 8px; font-size: clamp(24px, 7vw, 32px); line-height: 1.15; }
      h1 span { color: #a865c9; }
      p { margin: 0; color: #6e617e; font-size: 14px; line-height: 1.55; }
      .steps { display: grid; gap: 8px; margin: 18px 0; }
      .step {
        display: flex; align-items: center; gap: 10px; padding: 11px 12px;
        border-radius: 14px; background: #faf6ff; color: #5d516d; font-size: 13px;
      }
      .step b {
        display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px;
        border-radius: 50%; background: #e7d4ff; color: #7b4b9a; font-size: 11px;
      }
      button, a {
        display: block; width: 100%; margin-top: 10px; padding: 14px 16px;
        border: 0; border-radius: 16px; font: inherit; font-weight: 700;
        text-align: center; text-decoration: none; cursor: pointer;
      }
      button {
        color: #4b3562;
        background: linear-gradient(90deg, #e7b7f5, #b9d8ff);
        box-shadow: 0 8px 20px rgba(173, 132, 205, .22);
      }
      button:disabled { opacity: .55; cursor: wait; }
      a.soft { color: #6e4f86; background: #f7f0ff; border: 1px solid #eadcff; }
      small {
        display: block; min-height: 18px; margin-top: 14px;
        color: #8b7c9c; font-size: 12px; text-align: center;
      }
      .ok { color: #4f8a6b; }
      .bad { color: #b35b72; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="top">
          <div class="logo">Z</div>
          <div>
            <div class="brand">Zara</div>
            <div class="sub">verification</div>
          </div>
        </div>

        <h1>Ek chhota sa <span>verify</span> karo</h1>
        <p id="hello">Channel join karo, phir niche wala button dabao. Zara khud check karegi.</p>

        <div class="steps">
          <div class="step"><b>1</b><span>Updates channel join karo</span></div>
          <div class="step"><b>2</b><span>Verify button dabao</span></div>
          <div class="step"><b>3</b><span>Zara chat me /daily try karo</span></div>
        </div>

        <a class="soft" href="https://t.me/+HjHouGnrhjNlZTA1" target="_blank" rel="noreferrer">Updates channel kholo</a>
        <button id="verify" type="button" disabled>Verify karo</button>
        <small id="status">Zara bot ke andar se kholo.</small>
      </section>
    </main>

    <script>
      const app = window.Telegram && window.Telegram.WebApp;
      const button = document.getElementById("verify");
      const status = document.getElementById("status");
      const hello = document.getElementById("hello");

      const urlInitData = () => {
        for (const source of [window.location.search, window.location.hash]) {
          const query = source.replace(/^#\??/, "");
          if (!query) continue;
          const value = new URLSearchParams(query).get("tgWebAppData");
          if (value && value.trim()) return value;
        }
        return "";
      };

      const signedInitData = () => {
        const sdkData = app && typeof app.initData === "string" ? app.initData.trim() : "";
        return sdkData || urlInitData();
      };

      const setStatus = (message, tone = "") => {
        status.textContent = message;
        status.className = tone;
      };

      const ready = () => {
        if (app) {
          app.ready();
          app.expand();
        }

        const user = app && app.initDataUnsafe && app.initDataUnsafe.user;
        if (user && user.first_name) {
          hello.textContent = `Hi ${user.first_name}, channel join karke verify karo. Zara khud check karegi.`;
        }

        const canSend = !!(app && typeof app.sendData === "function");
        if (canSend && signedInitData()) {
          button.disabled = false;
          setStatus("Telegram connected. Verify dabao.", "ok");
          return true;
        }

        button.disabled = true;
        setStatus("Ye page Zara bot ke andar se kholo.", "bad");
        return false;
      };

      ready();
      window.setTimeout(ready, 300);
      window.setTimeout(ready, 1000);
      const sessionPoll = window.setInterval(() => {
        if (ready()) window.clearInterval(sessionPoll);
      }, 500);
      window.setTimeout(() => window.clearInterval(sessionPoll), 10000);

      button.addEventListener("click", () => {
        if (!ready()) return;

        const initData = signedInitData();
        if (!initData) {
          setStatus("Telegram data nahi mila. Zara bot se dobara kholo.", "bad");
          return;
        }

        button.disabled = true;
        setStatus("Verify bhej raha hoon...");

        try {
          app.sendData(JSON.stringify({
            action: "verify",
            init_data: initData,
            client_time: Math.floor(Date.now() / 1000)
          }));
          setStatus("Verify bhej diya. Zara chat me wapas jaake /daily try karo.", "ok");
          window.setTimeout(() => {
            try { app.close(); } catch (error) {}
          }, 1200);
        } catch (error) {
          button.disabled = false;
          setStatus("Verify nahi bheja. Dobara try karo.", "bad");
        }
      });
    </script>
  </body>
</html>
